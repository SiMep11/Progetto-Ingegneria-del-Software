<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - FlowCheck</title>
    <link rel="stylesheet" href="script/CSS/styleLogin.css">
    <script type="module" src="script/Javascript/app.js"></script>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            
            <div class="brand-header">
                <img src="images/logo.png" alt="FlowCheck Logo" class="brand-logo" width="30%">
                <h1 class="brand-logo">FlowCheck</h1>
            </div>

            <form class="login-form" id="login-form">

                <div id="loginError" style="display: none; text-align: center;"></div>
                
                <div class="input-group">
                    <label for="usernameInput">Email</label>
                    <input type="email" id="usernameInput" placeholder="example@mail.com" required>
                </div>
                
                <div class="input-group">
                    <label for="passwordInput">Password</label>
                    <input type="password" id="passwordInput" placeholder="Scrivi la tua password" required>
                </div>

                <button type="submit" id="loginButton" class="btn-login">Accedi</button>

            </form>

        </div>
    </div>
</body>
</html>
