<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Tester - FlowCheck</title>
    <link rel="stylesheet" href="script/CSS/styleHome.css">
    <script type="module" src="script/Javascript/app.js"></script>
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar">
            <div class="brand-header">
                <img src="images/logo.png" alt="Logo" class="sidebar-logo">
                <h2 class="sidebar-brand-name">FlowCheck</h2>
            </div>
            <nav class="sidebar-menu">
                <a href="#" class="menu-link active" id="navDashboard">Dashboard</a>
                <a href="ProgettiTester.html" class="menu-link" id="navProgetti">Tutti i Progetti</a>
                <a href="TicketsTester.html" class="menu-link" id="navTickets">Le mie Segnalazioni</a>
                <a href="commentiTester.html" class="menu-link" id="navCommenti">Feed e Commenti</a>
            </nav>
        </aside>

        <div class="main-wrapper">
            <header class="topbar">
                <div class="user-controls">
                    <span class="user-name" id="loggedUserName">Tester</span>
                    <img src="images/profile.png" alt="Profilo" class="user-avatar" id="userAvatar">
                    <button class="btn-logout" id="btnLogout" title="Esci">
                        <img src="images/logout.png" alt="Logout" style="width: 24px;">
                    </button>
                </div>
            </header>

            <main class="content-area">
                <section class="data-section" style="flex-direction: column;">

                    <div class="tickets-assigned-container" style="margin-bottom:1.5rem;">
                        <h3 class="section-title" style="color:#5B21B6;">⚑ Da Revisionare</h3>
                        <div class="scrollable-table">
                            <table class="data-table">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Titolo</th>
                                        <th>Tipo</th>
                                        <th>Azione</th>
                                    </tr>
                                </thead>
                                <tbody id="dashTesterReview">
                                    <tr><td colspan="4" style="text-align:center;padding:1rem;color:#888;">Caricamento...</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <div class="tickets-assigned-container">
                        <h3 class="section-title">Le mie ultime segnalazioni</h3>
                        <div class="scrollable-table">
                            <table class="data-table">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Titolo</th>
                                        <th>Tipo</th>
                                        <th>Stato</th>
                                    </tr>
                                </thead>
                                <tbody id="dashTesterTickets">
                                    <tr><td colspan="4" style="text-align:center;padding:1rem;color:#888;">Caricamento...</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>

                </section>
            </main>
        </div>
    </div>
</body>
</html>
